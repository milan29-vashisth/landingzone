
trigger:
- main

pool:
  name: 'Azure-Linux-Agents'

variables:
  terraformVersion: '1.9.5'
  serviceConnection: 'sc-hub-spoke-terraform'

steps:
- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: $(terraformVersion)

- script: |
    terraform init \
      -backend-config="resource_group_name=tfstate-rg-milan" \
      -backend-config="storage_account_name=milanhsstate2026" \
      -backend-config="container_name=tfstate" \
      -backend-config="key=hub-spoke-dev.tfstate" \
      -backend-config="use_azuread_auth=true"
  displayName: Terraform Init

- script: terraform fmt -check -recursive
  displayName: Terraform Format Check

- script: terraform validate
  displayName: Terraform Validate

- script: |
    terraform plan \
      -var-file="environments/dev/terraform.tfvars" \
      -out=tfplan
  displayName: Terraform Plan

- script: terraform apply -auto-approve tfplan
  displayName: Terraform Apply
