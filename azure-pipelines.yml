
trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.9.5'
  serviceConnection: 'sc-hub-spoke-terraform'
  subscriptionId: '6349a94a-bcc7-4da7-8f36-2f6bc3017bf7'

steps:
- checkout: self

- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: $(terraformVersion)

- task: TerraformTaskV4@4
  displayName: Terraform Init
  inputs:
    provider: azurerm
    command: init
    backendServiceArm: $(serviceConnection)
    backendAzureRmResourceGroupName: tfstate-rg-milan
    backendAzureRmStorageAccountName: milanhsstate2026
    backendAzureRmContainerName: tfstate
    backendAzureRmKey: hub-spoke-dev.tfstate
    backendAzureRmUseEntraIdForAuthentication: true
    workingDirectory: $(System.DefaultWorkingDirectory)

- task: TerraformTaskV4@4
  displayName: Terraform Format
  inputs:
    provider: azurerm
    command: custom
    customCommand: fmt
    commandOptions: '-check -recursive'
    workingDirectory: $(System.DefaultWorkingDirectory)

- task: TerraformTaskV4@4
  displayName: Terraform Validate
  inputs:
    provider: azurerm
    command: validate
    workingDirectory: $(System.DefaultWorkingDirectory)

- task: TerraformTaskV4@4
  name: TerraformPlan
  displayName: Terraform Plan
  inputs:
    provider: azurerm
    command: plan
    environmentServiceNameAzureRM: $(serviceConnection)
    commandOptions: >
      -input=false
      -out=tfplan
      -var="subscription_id=$(subscriptionId)"
    workingDirectory: $(System.DefaultWorkingDirectory)

- task: TerraformTaskV4@4
  displayName: Terraform Apply
  condition: and(succeeded(), eq(variables['TerraformPlan.changesPresent'], 'true'))
  inputs:
    provider: azurerm
    command: apply
    environmentServiceNameAzureRM: $(serviceConnection)
    commandOptions: ' -input=false -auto-approve tfplan'
    workingDirectory: $(System.DefaultWorkingDirectory)
